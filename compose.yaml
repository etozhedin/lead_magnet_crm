services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    ports:
      - '127.0.0.1:8017:8017'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:

openapi: 3.0.3
info:
  title: Lead Magnet CRM Operations System — API
  version: 1.0.0
  description: Session authentication. Obtain CSRF at /api/auth/csrf/; send X-CSRFToken
    on admin writes. Public endpoints are served only on PUBLIC_ORIGIN.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - Authentication
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '429':
          description: Too many sign-in attempts.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/campaigns/:
    get:
      operationId: campaigns_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: campaigns_create
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    put:
      operationId: campaigns_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
    patch:
      operationId: campaigns_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCampaignRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/campaigns/{id}/stats/:
    get:
      operationId: campaigns_stats_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStats'
          description: ''
  /api/leads/:
    get:
      operationId: leads_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - leads
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadList'
          description: ''
  /api/leads/{id}/:
    get:
      operationId: leads_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this lead.
        required: true
      tags:
      - leads
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
  /api/public/submit/:
    post:
      operationId: public_submit_create
      tags:
      - Public forms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/templates/:
    get:
      operationId: templates_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Forms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplateList'
          description: ''
    post:
      operationId: templates_create
      tags:
      - Forms
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
  /api/templates/{id}/:
    get:
      operationId: templates_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this form template.
        required: true
      tags:
      - Forms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
components:
  schemas:
    Campaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        template:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
      required:
      - created_at
      - id
      - links
      - name
      - template
    CampaignRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        template:
          type: integer
        active:
          type: boolean
      required:
      - name
      - template
    CampaignStats:
      type: object
      properties:
        visits:
          type: integer
        visitors:
          type: integer
        applications:
          type: integer
        conversion_rate:
          type: number
          format: double
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelMetrics'
      required:
      - applications
      - channels
      - conversion_rate
      - visitors
      - visits
    ChannelEnum:
      enum:
      - instagram
      - x
      - youtube
      - threads
      type: string
      description: |-
        * `instagram` - Instagram
        * `x` - X
        * `youtube` - YouTube
        * `threads` - Threads
    ChannelMetrics:
      type: object
      properties:
        visits:
          type: integer
        visitors:
          type: integer
        applications:
          type: integer
        conversion_rate:
          type: number
          format: double
        channel:
          $ref: '#/components/schemas/ChannelEnum'
      required:
      - applications
      - channel
      - conversion_rate
      - visitors
      - visits
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Lead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        campaign:
          type: integer
          readOnly: true
        channel:
          type: string
          readOnly: true
        data: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - campaign
      - channel
      - created_at
      - data
      - id
    Link:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        token:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
      - channel
      - token
      - url
    LinkRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
      required:
      - channel
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    PaginatedCampaignList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    PaginatedLeadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
    PaginatedTemplateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    PatchedCampaignRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        template:
          type: integer
        active:
          type: boolean
    SubmissionRequest:
      type: object
      properties:
        ticket:
          type: string
          minLength: 1
          maxLength: 1000
        data:
          type: object
          additionalProperties:
            type: string
            maxLength: 4000
      required:
      - data
      - ticket
    SubmissionResult:
      type: object
      properties:
        id:
          type: integer
        created:
          type: boolean
      required:
      - created
      - id
    Template:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        fields:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - fields
      - id
      - name
    TemplateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - file
      - name
    User:
      type: object
      properties:
        username:
          type: string
      required:
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
